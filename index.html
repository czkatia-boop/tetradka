<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Тетрадка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Настройка: адрес скрипта из Apps Script (Развернуть → Веб-приложение) ===== */
:root{
  --paper:#FBFCFE; --grid:rgba(52,98,190,.09); --text:#1B2330; --muted:#5D6778;
  --ink:#1E4FA3; --ink-soft:rgba(30,79,163,.10);
  --marker:#FFE45C; --red:#C8323C; --green:#2F8F5B; --card:#FFFFFF; --line:#D9E0EC;
  color-scheme:light;
}
:root[data-kid="1"]{ --ink:#6B3FA0; --ink-soft:rgba(107,63,160,.10); }
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131924; --grid:rgba(140,170,255,.07); --text:#E6EAF2; --muted:#9AA4B6;
    --ink:#82A9F2; --ink-soft:rgba(130,169,242,.14);
    --marker:#C9A82A; --red:#F07A80; --green:#6BCB95; --card:#1B2331; --line:#2C3647;
    color-scheme:dark;
  }
  :root[data-kid="1"]{ --ink:#BB9DEB; --ink-soft:rgba(187,157,235,.14); }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.5; color:var(--text);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:560px;margin:0 auto;padding:20px 18px 48px}
h1,.hand{font-family:"Caveat","Comic Sans MS",cursive;font-weight:700;color:var(--ink)}
h1{font-size:2.6rem;line-height:1.05;margin:8px 0 4px}
h2{font-size:1.05rem;font-weight:600;margin:28px 0 10px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:.92rem;padding:6px 0}

/* Выбор ребёнка */
.pick{display:grid;gap:14px;margin-top:28px}
.pick button{
  text-align:left;padding:18px 20px;border-radius:14px;background:var(--card);
  border:2px solid var(--line);font-family:"Caveat",cursive;font-size:2.2rem;font-weight:700;
}
.pick button:nth-child(1){color:#1E4FA3}
.pick button:nth-child(2){color:#6B3FA0}
@media (prefers-color-scheme: dark){.pick button:nth-child(1){color:#82A9F2}.pick button:nth-child(2){color:#BB9DEB}}

/* Неделя — маркер по дням */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 6px}
.day{text-align:center;font-size:.85rem;color:var(--muted);padding:6px 0;position:relative}
.day b{display:block;font-family:"Caveat",cursive;font-size:1.6rem;line-height:1;color:var(--text);position:relative;z-index:1}
.day.on b::after{
  content:"";position:absolute;left:-6px;right:-6px;top:42%;height:46%;z-index:-1;
  background:var(--marker);border-radius:3px 8px 4px 9px;transform:rotate(-2deg);
}
.day.today{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact .n{font-family:"Caveat",cursive;font-size:2rem;font-weight:700;line-height:1;color:var(--ink)}
.fact .l{font-size:.85rem;color:var(--muted)}

/* Дела */
.chores{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chores li+li{border-top:1px dashed var(--line)}
.chore{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left}
.box{
  flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;
  display:grid;place-items:center;font-family:"Caveat",cursive;font-size:1.9rem;font-weight:700;color:var(--ink);
}
.chore[aria-checked="true"] .box::before{content:"✓";line-height:1;transform:translateY(-2px) rotate(-6deg)}
.chore[aria-checked="true"] .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ink)}

/* Предметы */
.subjects{display:grid;gap:10px}
.subject{
  display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;
  padding:16px 18px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:10px;
}
.subject .s{font-weight:600}
.subject .c{font-size:.88rem;color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}

/* Задание */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 22px}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.q{font-size:1.25rem;line-height:1.45;margin:0 0 18px;white-space:pre-wrap}
.options{display:grid;gap:10px}
.opt{
  text-align:left;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:12px;
}
.opt.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}
.answer-row{display:flex;gap:10px}
.answer-row input{
  flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--text);
}
.btn{
  padding:13px 20px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;
}
@media (prefers-color-scheme: dark){.btn{color:#131924}}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.helpers button{padding:9px 14px;border-radius:20px;background:var(--ink-soft);color:var(--ink);font-size:.92rem;font-weight:500}
.note{
  margin-top:16px;padding:14px 16px;background:var(--card);border-radius:10px;border:1px solid var(--line);
  border-left:4px solid var(--ink);white-space:pre-wrap;
}
.note.hint{border-left-color:var(--marker)}
.verdict{font-family:"Caveat",cursive;font-size:2.2rem;font-weight:700;margin:18px 0 4px}
.verdict.ok{color:var(--green)}
.verdict.no{color:var(--red)}
.next{margin-top:20px;width:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* Итог */
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rates button{padding:16px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:1.05rem}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--text);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;
  max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="muted">Загружаю…</p></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Вставьте сюда адрес веб-приложения из Apps Script ===== */
const API = 'https://script.google.com/macros/s/AKfycbzwBSGNbH8aw9kqsn77o2_fJJJQvZAGXoIwdw_wZ92_9wKNS-Te5yt1x8AbfM9t_EwF_w/exec';

const SESSION_SIZE = 10;
const app = document.getElementById('app');
let state = { kids: [], data: null, kidIndex: 0 };

/* ---------- Связь с таблицей ---------- */
async function apiGet(params) {
  const url = API + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* Дата «сегодня» по Варшаве, ГГГГ-ММ-ДД. Дела можно отмечать только за этот день. */
function warsawDay(d) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Warsaw', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d || new Date());
}
const NOT_TODAY = /только в тот же день/i;

function queue() { try { return JSON.parse(localStorage.getItem('outbox') || '[]'); } catch (e) { return []; } }
function saveQueue(q) { try { localStorage.setItem('outbox', JSON.stringify(q)); } catch (e) {} }

async function send(body) {
  body.at = body.at || new Date().toISOString();
  const q = queue(); q.push(body); saveQueue(q);
  await flush();
}
let flushing = false;
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    let q = queue();
    // Отметки дел за прошлый день (например, сделанные без интернета) не отправляем.
    const today = warsawDay();
    const fresh = q.filter(b => b.action !== 'chore' || b.day === today);
    if (fresh.length !== q.length) { q = fresh; saveQueue(q); toast('Отметки дел за прошлый день не засчитываются.'); }
    while (q.length) {
      const res = await fetch(API, { method: 'POST', body: JSON.stringify(q[0]) });
      const data = await res.json();
      if (data.error && !/не найден/i.test(data.error) && !NOT_TODAY.test(data.error)) throw new Error(data.error);
      q.shift(); saveQueue(q);
    }
  } catch (e) {
    toast('Нет связи. Ответы сохранены и отправятся позже.');
  } finally { flushing = false; }
}
window.addEventListener('online', flush);

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Старт ---------- */
async function start() {
  if (API.indexOf('ВСТАВЬТЕ') === 0) {
    app.innerHTML = '<h1>Почти готово</h1><p>В файле нужно вставить адрес скрипта: строка <b>const API</b>.</p>';
    return;
  }
  try {
    const { kids } = await apiGet({ action: 'kids' });
    state.kids = kids;
    const fromUrl = new URLSearchParams(location.search).get('kid');
    let saved = null; try { saved = localStorage.getItem('kid'); } catch (e) {}
    const kid = kids.find(k => k.id === fromUrl) || kids.find(k => k.id === saved);
    if (kid) openKid(kid.id); else renderPick();
  } catch (e) {
    app.innerHTML = '<h1>Нет связи с таблицей</h1><p>Проверьте интернет и обновите страницу. Если не помогает, проверьте адрес скрипта.</p><p class="muted">' + esc(e.message) + '</p>';
  }
  flush();
}

function renderPick() {
  app.innerHTML = '<h1>Кто занимается?</h1><div class="pick">' +
    state.kids.map(k => '<button data-id="' + esc(k.id) + '">' + esc(k.name) + '</button>').join('') + '</div>';
  app.querySelectorAll('.pick button').forEach(b => b.onclick = () => openKid(b.dataset.id));
}

async function openKid(id) {
  try { localStorage.setItem('kid', id); } catch (e) {}
  state.kidIndex = Math.max(0, state.kids.findIndex(k => k.id === id));
  document.documentElement.dataset.kid = String(state.kidIndex);
  app.innerHTML = '<p class="muted">Загружаю…</p>';
  try {
    state.data = await apiGet({ action: 'load', kid: id });
    state.day = warsawDay();
    renderHome();
  } catch (e) {
    app.innerHTML = '<h1>Не загрузилось</h1><p>' + esc(e.message) + '</p><button class="btn" id="retry">Попробовать снова</button>';
    document.getElementById('retry').onclick = () => openKid(id);
  }
}

/* ---------- Главная ---------- */
function renderHome() {
  const d = state.data;
  const w = d.week || {};
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const jsDays = [1,2,3,4,5,6,0];
  const todayJs = new Date().getDay();
  const subjects = {};
  d.tasks.forEach(t => { (subjects[t.subject] = subjects[t.subject] || []).push(t); });

  const money = w['Карманные, зл'] || '—';
  const chorePct = w['Дела выполнены, %'] || '0%';

  app.innerHTML = `
    <div class="top">
      <h1>Привет, ${esc(d.kid.name)}</h1>
      <button class="link" id="switch">Не ты?</button>
    </div>
    <div class="week" aria-label="Дни с занятиями на этой неделе">
      ${jsDays.map((js, i) => `<div class="day ${d.studiedDays.includes(js) ? 'on' : ''} ${js === todayJs ? 'today' : ''}">
        ${names[i]}<b>${d.studiedDays.includes(js) ? '✓' : '·'}</b></div>`).join('')}
    </div>
    <div class="facts">
      <div class="fact"><div class="n">${esc(money)}</div><div class="l">злотых на этой неделе</div></div>
      <div class="fact"><div class="n">${esc(chorePct)}</div><div class="l">дел сделано за неделю</div></div>
    </div>

    <h2>Дела на сегодня</h2>
    ${d.chores.length ? `<ul class="chores">${d.chores.map(c => `
      <li><button class="chore" role="checkbox" aria-checked="${c.done}" data-id="${esc(c.id)}">
        <span class="box"></span><span class="name">${esc(c.name)}</span></button></li>`).join('')}</ul>`
      : '<div class="empty">На сегодня дел нет.</div>'}

    <h2>Учёба</h2>
    ${Object.keys(subjects).length ? `<div class="subjects">${Object.keys(subjects).map(s => {
      const list = subjects[s];
      const left = list.filter(t => !isMastered(t.id)).length;
      return `<button class="subject" data-s="${esc(s)}"><span class="s">${esc(s)}</span>
        <span class="c">${left ? 'осталось ' + left : 'всё выучено, можно повторить'}</span></button>`;
    }).join('')}</div>`
      : '<div class="empty">Заданий на эту неделю пока нет. Скажи маме, по каким темам скоро проверочные.</div>'}
  `;

  document.getElementById('switch').onclick = () => { try { localStorage.removeItem('kid'); } catch (e) {} document.documentElement.dataset.kid = '0'; renderPick(); };
  app.querySelectorAll('.chore').forEach(b => b.onclick = () => toggleChore(b));
  app.querySelectorAll('.subject').forEach(b => b.onclick = () => startSession(b.dataset.s));
}

function toggleChore(btn) {
  // Список дел загружен за другой день (страница была открыта с вечера) — обновляем, отметить вчерашнее нельзя.
  if (state.day !== warsawDay()) {
    toast('Наступил новый день. Отмечать можно только сегодняшние дела.');
    openKid(state.data.kid.id);
    return;
  }
  const c = state.data.chores.find(x => x.id === btn.dataset.id);
  c.done = !c.done;
  btn.setAttribute('aria-checked', String(c.done));
  send({ action: 'chore', kid: state.data.kid.id, choreId: c.id, choreName: c.name, done: c.done, day: state.day });
}

// Вернулись к открытой вкладке на следующий день — перезагрузить данные.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.data && state.day && state.day !== warsawDay()) openKid(state.data.kid.id);
});

/* ---------- Подбор заданий ---------- */
function hist(id) { return state.data.history[id] || { tries: 0, firstTry: 0, lastOk: false, last: 0 }; }
function isMastered(id) { const h = hist(id); return h.firstTry >= 2 && h.lastOk; }

function buildPool(subject) {
  const list = state.data.tasks.filter(t => t.subject === subject);
  const weak = list.filter(t => hist(t.id).tries > 0 && !isMastered(t.id)).sort((a, b) => hist(a.id).last - hist(b.id).last);
  const fresh = list.filter(t => hist(t.id).tries === 0);
  const mastered = list.filter(t => isMastered(t.id)).sort(() => Math.random() - .5);
  const main = [...weak, ...fresh].slice(0, SESSION_SIZE);
  // выученное: 2 задания на повторение, или 5, если нового нет
  const reviewCount = Math.min(main.length ? 2 : 5, SESSION_SIZE - main.length);
  return { main, review: mastered.slice(0, reviewCount) };
}

let S = null;
function startSession(subject) {
  const { main, review } = buildPool(subject);
  const items = [...main, ...review];
  if (!items.length) { toast('Заданий по этому предмету пока нет.'); return; }
  S = {
    subject, remaining: items.slice(), total: items.length, done: 0,
    target: 1, streakOk: 0, streakBad: 0, requeued: new Set(), started: Date.now()
  };
  nextQuestion();
}

function pickNext() {
  // Подстройка сложности: 3 верных подряд — сложнее, 2 ошибки подряд — проще
  const r = S.remaining;
  if (S.streakOk >= 3) S.target = Math.min(3, S.target + 1), S.streakOk = 0;
  if (S.streakBad >= 2) S.target = Math.max(1, S.target - 1), S.streakBad = 0;
  let idx = 0, best = 99;
  r.forEach((t, i) => { const d = Math.abs(t.level - S.target); if (d < best) { best = d; idx = i; } });
  // ранее ошибочные идут первыми, если они в начале списка
  if (r[0] && hist(r[0].id).tries > 0 && !isMastered(r[0].id)) idx = 0;
  return r.splice(idx, 1)[0];
}

/* ---------- Экран задания ---------- */
function nextQuestion() {
  if (!S.remaining.length) return renderFinish();
  const t = pickNext();
  S.q = { t, attempt: 1, hints: 0, shown: Date.now(), finished: false, hintStep: 0, explainStep: 0 };
  renderQuestion();
}

function renderQuestion() {
  const { t } = S.q;
  const pct = Math.round(S.done / S.total * 100);
  app.innerHTML = `
    <div class="top"><span class="muted">${esc(t.subject)}${t.topic ? ', ' + esc(t.topic) : ''}</span>
      <button class="link" id="quit">Закончить</button></div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <p class="q">${esc(t.question)}</p>
    <div id="answer"></div>
    <div id="feedback" aria-live="polite"></div>
    <div class="helpers" id="helpers"></div>
    <div id="notes"></div>
  `;
  document.getElementById('quit').onclick = renderFinish;
  renderAnswerArea();
  renderHelpers();
}

function renderAnswerArea() {
  const { t } = S.q;
  const box = document.getElementById('answer');
  if (t.type === 'choice' && t.options.length) {
    const opts = S.q.order || (S.q.order = t.options.slice().sort(() => Math.random() - .5));
    box.innerHTML = '<div class="options">' + opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('') + '</div>';
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (!S.q.finished && !b.classList.contains('wrong')) check(opts[b.dataset.i], b); });
  } else {
    box.innerHTML = `<form class="answer-row" id="f" autocomplete="off">
      <input id="inp" aria-label="Ответ" placeholder="Твой ответ" autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit">Проверить</button></form>`;
    const inp = document.getElementById('inp');
    setTimeout(() => inp.focus(), 50);
    document.getElementById('f').onsubmit = e => { e.preventDefault(); if (!S.q.finished && inp.value.trim()) check(inp.value, inp); };
  }
}

function renderHelpers() {
  const { t } = S.q;
  const h = document.getElementById('helpers');
  if (S.q.finished) { h.innerHTML = ''; return; }
  const btns = [];
  if ((S.q.hintStep === 0 && t.hint1) || (S.q.hintStep === 1 && t.hint2)) btns.push('<button id="hint">Подсказка</button>');
  if (S.q.explainStep === 0 && t.explain) btns.push('<button id="exp">Не понимаю, объясни</button>');
  if (S.q.explainStep === 1 && t.explain2) btns.push('<button id="exp2">Объясни по-другому</button>');
  h.innerHTML = btns.join('');
  const hb = document.getElementById('hint'); if (hb) hb.onclick = showHint;
  const eb = document.getElementById('exp'); if (eb) eb.onclick = () => showExplain(1);
  const e2 = document.getElementById('exp2'); if (e2) e2.onclick = () => showExplain(2);
}

function addNote(text, cls) {
  const n = document.createElement('div');
  n.className = 'note ' + (cls || '');
  n.textContent = text;
  document.getElementById('notes').appendChild(n);
}
function showHint() {
  const { t } = S.q;
  S.q.hintStep++; S.q.hints++;
  addNote(S.q.hintStep === 1 ? t.hint1 : t.hint2, 'hint');
  renderHelpers();
}
function showExplain(n) {
  const { t } = S.q;
  S.q.explainStep = n; S.q.hints++;
  addNote(n === 1 ? t.explain : t.explain2);
  renderHelpers();
}

function norm(s) {
  return String(s).toLowerCase().replace(/ё/g, 'е').replace(/[.,!?;:"«»]/g, '').replace(/\s+/g, ' ').trim();
}
function isCorrect(given, answer) {
  return answer.split('|').map(norm).includes(norm(given));
}

function check(given, el) {
  const { t } = S.q;
  const ok = isCorrect(given, t.answer);
  const fb = document.getElementById('feedback');
  if (ok) {
    if (el.classList.contains('opt')) el.classList.add('right');
    fb.innerHTML = '<div class="verdict ok">Верно!</div>';
    finishQuestion(true);
    return;
  }
  if (el.classList.contains('opt')) el.classList.add('wrong');
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  if (S.q.attempt >= 3) {
    fb.innerHTML = `<div class="verdict no">Разберём</div><p>Правильный ответ: <b>${esc(t.answer.split('|')[0])}</b></p>`;
    document.querySelectorAll('.opt').forEach(b => { if (isCorrect(b.textContent, t.answer)) b.classList.add('right'); });
    if (S.q.explainStep === 0 && t.explain) addNote(t.explain);
    finishQuestion(false);
    return;
  }
  S.q.attempt++;
  fb.innerHTML = '<div class="verdict no">Почти</div><p class="muted">Попробуй ещё раз.</p>';
  if ((S.q.hintStep === 0 && t.hint1) || (S.q.hintStep === 1 && t.hint2)) showHint();
  const inp = document.getElementById('inp'); if (inp) { inp.select(); }
}

function finishQuestion(ok) {
  const { t } = S.q;
  S.q.finished = true;
  const seconds = Math.round((Date.now() - S.q.shown) / 1000);
  send({ action: 'answer', kid: state.data.kid.id, taskId: t.id, subject: t.subject, topic: t.topic,
         correct: ok, attempt: S.q.attempt, hints: S.q.hints, seconds });
  // обновляем историю локально
  const h = state.data.history[t.id] || (state.data.history[t.id] = { tries: 0, firstTry: 0, lastOk: false, last: 0 });
  h.tries++; h.last = Date.now(); h.lastOk = ok && S.q.attempt === 1; if (h.lastOk) h.firstTry++;
  if (ok && S.q.attempt === 1) { S.streakOk++; S.streakBad = 0; } else { S.streakBad++; S.streakOk = 0; }
  // ошибочное задание ещё раз в конце занятия
  if (!ok && !S.requeued.has(t.id)) { S.requeued.add(t.id); S.remaining.push(t); S.total++; }
  S.done++;
  if (ok && t.explain && S.q.explainStep === 0) {
    const h2 = document.getElementById('helpers');
    h2.innerHTML = '<button id="why">Почему так?</button>';
    document.getElementById('why').onclick = () => { addNote(t.explain); h2.innerHTML = ''; };
  } else {
    renderHelpers();
  }
  const btn = document.createElement('button');
  btn.className = 'btn next'; btn.textContent = S.remaining.length ? 'Дальше' : 'Закончить';
  btn.onclick = nextQuestion;
  document.getElementById('notes').after(btn);
  btn.focus();
  const today = new Date().getDay();
  if (!state.data.studiedDays.includes(today)) state.data.studiedDays.push(today);
}

/* ---------- Итог ---------- */
function renderFinish() {
  const minutes = Math.max(1, Math.round((Date.now() - S.started) / 60000));
  app.innerHTML = `
    <h1>${S.done ? 'Готово!' : 'Занятие закрыто'}</h1>
    <p>${S.done ? 'Заданий сделано: ' + S.done + '. Время: ' + minutes + ' мин.' : 'Ни одного задания не сделано, этот раз не считается.'}</p>
    ${S.done ? `<h2>Как тебе было?</h2>
    <div class="rates">${['легко','нормально','сложно','скучно'].map(r => `<button data-r="${r}">${r[0].toUpperCase() + r.slice(1)}</button>`).join('')}</div>`
    : '<button class="btn next" id="home">На главную</button>'}
  `;
  if (!S.done) { document.getElementById('home').onclick = () => openKid(state.data.kid.id); return; }
  app.querySelectorAll('.rates button').forEach(b => b.onclick = () => {
    send({ action: 'session', kid: state.data.kid.id, subject: S.subject, minutes, rating: b.dataset.r });
    toast('Записано. Молодец!');
    setTimeout(() => openKid(state.data.kid.id), 600);
  });
}

start();
</script>
